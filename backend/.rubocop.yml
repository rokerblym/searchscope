plugins:
  - rubocop-rails
  - rubocop-rspec

AllCops:
  NewCops: enable
  TargetRubyVersion: 3.4
  Exclude:
    - vendor/**/*
    - tmp/**/*
    - log/**/*

Style/Documentation:
  Enabled: false
Style/StringLiterals:
  EnforcedStyle: double_quotes
Layout/LineLength:
  Max: 120
# API serializers and provider normalization have more branches than tiny
# utility methods; retain measured limits while keeping cohesive methods.
Metrics/MethodLength:
  Max: 20
Metrics/AbcSize:
  Max: 35
Metrics/ClassLength:
  Max: 180
Metrics/CyclomaticComplexity:
  Max: 10
Metrics/PerceivedComplexity:
  Max: 10
Metrics/BlockLength:
  Exclude:
    - spec/**/*
    - config/routes.rb
RSpec/ExampleLength:
  Max: 20
RSpec/MultipleExpectations:
  Max: 8
