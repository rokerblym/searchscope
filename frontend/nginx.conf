# This service must be private behind a TLS terminator that overwrites
# X-Forwarded-Proto. Never trust client-supplied forwarding headers at the edge.
map $http_x_forwarded_proto $searchscope_forwarded_proto {
    default $scheme;
    https https;
}

map $uri $searchscope_cache_control {
    default "no-cache";
    ~^/api/ "no-store";
    ~^/assets/ "public, max-age=31536000, immutable";
}

# Exclude query strings, cookies, credentials, and IP addresses from access logs.
log_format searchscope escape=json '{"timestamp":"$time_iso8601","event":"http_request","method":"$request_method","path":"$uri","status":$status,"duration_seconds":$request_time}';

server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    server_tokens off;
    client_max_body_size 16k;
    access_log /dev/stdout searchscope;
    error_log /dev/stderr crit;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    # Inline styles support the dashboard's calculated bar widths. Scripts
    # remain restricted to bundled same-origin assets, without unsafe-inline.
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'self'; object-src 'none'; base-uri 'self'; frame-ancestors 'none'; form-action 'self'" always;
    add_header Cache-Control $searchscope_cache_control always;

    location /api/ {
        proxy_pass http://backend:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $searchscope_forwarded_proto;
        proxy_set_header Connection "";
        proxy_connect_timeout 5s;
        proxy_read_timeout 60s;
        proxy_send_timeout 10s;
        proxy_buffering off;
    }

    location /assets/ {
        try_files $uri =404;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
