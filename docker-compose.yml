name: searchscope

services:
  mongodb:
    image: mongo:8.0
    ports:
      - "127.0.0.1:27017:27017"
    volumes:
      - mongodb_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "quit(db.adminCommand({ping:1}).ok === 1 ? 0 : 1)"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s

  backend:
    image: searchscope-backend:dev
    build: ./backend
    environment:
      RAILS_ENV: development
      MONGODB_URI: mongodb://mongodb:27017/searchscope_development
      SERPAPI_API_KEY: ${SERPAPI_API_KEY:-}
      SEARCH_PROVIDER: ${SEARCH_PROVIDER:-serpapi}
      SEARCH_RETENTION_DAYS: ${SEARCH_RETENTION_DAYS:-30}
      SERPAPI_USER_DAILY_LIMIT: ${SERPAPI_USER_DAILY_LIMIT:-20}
      SERPAPI_GLOBAL_DAILY_LIMIT: ${SERPAPI_GLOBAL_DAILY_LIMIT:-200}
    ports:
      - "127.0.0.1:3000:3000"
    volumes:
      - ./backend:/app
    depends_on:
      mongodb:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "ruby", "-rnet/http", "-e", "exit(Net::HTTP.get_response(URI('http://127.0.0.1:3000/api/v1/health')).code == '200' ? 0 : 1)"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s

  frontend:
    image: searchscope-frontend:dev
    build: ./frontend
    environment:
      API_PROXY_TARGET: http://backend:3000
    ports:
      - "127.0.0.1:5173:5173"
    volumes:
      - ./frontend:/app
      - frontend_node_modules:/app/node_modules
    depends_on:
      backend:
        condition: service_healthy

volumes:
  mongodb_data:
  frontend_node_modules:
